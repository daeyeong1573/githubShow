<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>황금 금고 해독기 (실시간)</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{--bg:#2a3f8f;--frame:#ffd34d;--frame-dk:#e0a400;--panel:#fff3c4;--steel:#dcdcdc;--dial:#151515;--ink:#5a3200;--up:#2d8cf0;--down:#ff3fa4;--ok:#1fa35b}
body{background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;margin:0;padding:24px 16px}
.wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:flex-start}
.box{background:var(--frame);border:4px solid var(--frame-dk);border-radius:22px;padding:14px;width:min(440px,100%);box-sizing:border-box}
.inner{background:var(--panel);border-radius:14px;padding:16px;display:grid;gap:12px}
h1,h2{margin:0;text-align:center;color:#b84a00;font-size:22px}
.range{display:flex;justify-content:center;gap:8px;font:700 20px ui-monospace,monospace}
.range span{background:#8a8a8a;color:#ffe14a;padding:6px 14px;border-radius:4px;min-width:64px;text-align:center}
.dial{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--steel);padding:10px;border-radius:10px}
.dial div{background:var(--dial);color:#fff;font:700 56px ui-monospace,monospace;text-align:center;border-radius:6px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;font-size:16px;font-weight:700;border:0;border-radius:10px;padding:12px 8px;color:#fff;cursor:pointer;background:#8a5a00}
button:disabled{opacity:.4;cursor:default}
.up{background:var(--up)}.down{background:var(--down)}.ok{background:var(--ok)}.full{grid-column:1/-1}
.msg{text-align:center;font-weight:700;min-height:1.4em}
.small{font-size:13px;line-height:1.5}
canvas{width:100%;border-radius:8px;background:#000;cursor:crosshair;display:block}
#crop{width:auto;max-width:100%;height:48px;background:#fff}
ol{margin:0;padding-left:22px;font-size:14px;max-height:160px;overflow:auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="box"><div class="inner">
    <h1>스핑크스의 황금 금고 해독기</h1>
    <div class="range"><span id="lo">1</span><span style="background:none;color:#555;min-width:0">~</span><span id="hi">9999</span></div>
    <div class="dial" id="dial"></div>
    <div class="msg" id="msg"></div>
    <div class="small" style="text-align:center">시도 <b id="n">1</b>/14</div>
    <div class="btns">
      <button class="up" id="bUp">▲ 정답이 더 큼</button>
      <button class="down" id="bDown">▼ 정답이 더 작음</button>
      <button class="ok full" id="bOk">🎉 금고 열림</button>
      <button class="full" id="bReset">처음부터 다시</button>
    </div>
    <ol id="log"></ol>
  </div></div>

  <div class="box"><div class="inner">
    <h2>실시간 화면 연동</h2>
    <div class="small">
      1. <b>화면 공유 시작</b>을 누르고 게임 창을 고릅니다.<br>
      2. 아래 화면에서 게임의 <b>「1 ~ 9999」 범위 칸</b>을 마우스로 드래그해 감쌉니다.<br>
      3. 게임이 범위를 바꾸면 왼쪽 숫자가 자동으로 바뀝니다.
    </div>
    <button id="bShare">화면 공유 시작</button>
    <canvas id="view" width="640" height="360"></canvas>
    <div class="small">인식 영역 · 읽은 글자: <b id="ocr">-</b></div>
    <canvas id="crop" width="10" height="10"></canvas>
  </div></div>
</div>

<script>
const MAX = 14, $ = (id) => document.getElementById(id);
let lo, hi, n, done;

const guess = () => Math.floor((lo + hi) / 2);

function render(text) {
  $('lo').textContent = lo;
  $('hi').textContent = hi;
  $('dial').innerHTML = String(guess()).padStart(4, '0').split('').map((d) => `<div>${d}</div>`).join('');
  $('n').textContent = Math.min(n, MAX);
  $('msg').textContent = text;
  $('bUp').disabled = $('bDown').disabled = $('bOk').disabled = done;
}

function reset() {
  lo = 1; hi = 9999; n = 1; done = false;
  $('log').innerHTML = '';
  render('이 숫자를 게임에 입력하세요');
}

function log(text) {
  const li = document.createElement('li');
  li.textContent = text;
  $('log').prepend(li);
}

function setRange(newLo, newHi, how) {
  log(`${guess()} → ${how} (범위 ${newLo}~${newHi})`);
  lo = newLo; hi = newHi; n++;
  if (lo > hi) { done = true; return render('범위가 비었습니다. 처음부터 다시 하세요.'); }
  render(lo === hi ? `정답 확정: ${lo}` : `남은 후보 ${hi - lo + 1}개`);
}

$('bUp').onclick = () => setRange(guess() + 1, hi, '더 큼 ▲');
$('bDown').onclick = () => setRange(lo, guess() - 1, '더 작음 ▼');
$('bOk').onclick = () => { done = true; log(`${guess()} → 정답 🎉`); render(`${n}번 만에 열었습니다!`); };
$('bReset').onclick = reset;
reset();

/* 화면 공유 + 범위 칸 OCR */
const view = $('view'), vctx = view.getContext('2d');
const crop = $('crop'), cctx = crop.getContext('2d', { willReadFrequently: true });
const video = document.createElement('video');
let sel = null, drag = null, worker = null, busy = false;

$('bShare').onclick = async () => {
  try {
    video.srcObject = await navigator.mediaDevices.getDisplayMedia({ video: true });
    await video.play();
    $('bShare').textContent = '공유 중 (다시 누르면 창 변경)';
    if (!worker) {
      $('ocr').textContent = '인식기 불러오는 중…';
      worker = await Tesseract.createWorker('eng');
      await worker.setParameters({ tessedit_char_whitelist: '0123456789~', tessedit_pageseg_mode: '7' });
      $('ocr').textContent = '범위 칸을 드래그하세요';
    }
    requestAnimationFrame(draw);
  } catch (error) {
    $('ocr').textContent = '화면 공유가 취소되었거나 지원되지 않습니다';
  }
};

function draw() {
  if (!video.videoWidth) return requestAnimationFrame(draw);
  view.height = Math.round(view.width * video.videoHeight / video.videoWidth);
  vctx.drawImage(video, 0, 0, view.width, view.height);
  const r = drag || sel;
  if (r) { vctx.strokeStyle = '#ff3fa4'; vctx.lineWidth = 3; vctx.strokeRect(r.x, r.y, r.w, r.h); }
  requestAnimationFrame(draw);
}

function point(e) {
  const b = view.getBoundingClientRect();
  return { x: (e.clientX - b.left) * view.width / b.width, y: (e.clientY - b.top) * view.height / b.height };
}
view.onpointerdown = (e) => { const p = point(e); drag = { x0: p.x, y0: p.y, x: p.x, y: p.y, w: 0, h: 0 }; };
view.onpointermove = (e) => {
  if (!drag) return;
  const p = point(e);
  Object.assign(drag, { x: Math.min(drag.x0, p.x), y: Math.min(drag.y0, p.y), w: Math.abs(p.x - drag.x0), h: Math.abs(p.y - drag.y0) });
};
view.onpointerup = () => { if (drag && drag.w > 5 && drag.h > 5) sel = drag; drag = null; };

// ponytail: 700ms 주기 OCR, 인식이 흔들리면 같은 값이 2번 연속일 때만 반영
let pending = '';
setInterval(async () => {
  if (!sel || !worker || busy || !video.videoWidth) return;
  busy = true;
  const k = video.videoWidth / view.width, S = 3;
  crop.width = sel.w * k * S; crop.height = sel.h * k * S;
  cctx.drawImage(video, sel.x * k, sel.y * k, sel.w * k, sel.h * k, 0, 0, crop.width, crop.height);
  // 노란 숫자만 검정, 회색 칸·테두리·배경은 전부 흰색 (노랑 = 빨강·초록 높고 파랑 낮음)
  const img = cctx.getImageData(0, 0, crop.width, crop.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const isYellow = d[i] > 160 && d[i + 1] > 130 && d[i + 2] < d[i + 1] - 50;
    d[i] = d[i + 1] = d[i + 2] = isYellow ? 0 : 255;
  }
  cctx.putImageData(img, 0, 0);
  try {
    // 왼쪽 반 = 최소값, 오른쪽 반 = 최대값. 흰 여백을 둘러야 앞자리 '1'을 놓치지 않음
    const half = Math.floor(crop.width / 2), h = crop.height;
    const pad = (sx, sw) => {
      const c = document.createElement('canvas'), m = h;
      c.width = sw + m * 2; c.height = h + m * 2;
      const x = c.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(crop, sx, 0, sw, h, m, m, sw, h);
      return c;
    };
    const [left, right] = await Promise.all([
      worker.recognize(pad(0, half)),
      worker.recognize(pad(half, crop.width - half)),
    ]);
    const a = parseInt(left.data.text.replace(/\D/g, ''), 10);
    const b = parseInt(right.data.text.replace(/\D/g, ''), 10);
    $('ocr').textContent = `${a || '?'} ~ ${b || '?'}`;
    if (a && b) {
      const key = `${a}-${b}`;
      // 게임이 1~9999로 돌아가면 새 판으로 보고 자동 초기화
      if (a === 1 && b === 9999 && (lo !== 1 || hi !== 9999 || done)) {
        if (key === pending) reset();
        pending = key;
        return;
      }
      // 범위는 줄어들기만 하므로 지금 범위보다 넓어지면 오인식으로 보고 버림
      const isValid = !done && a >= lo && b <= hi && a <= b && (a !== lo || b !== hi);
      if (isValid && key === pending) setRange(a, b, '화면 인식');
      pending = key;
    }
  } finally {
    busy = false;
  }
}, 700);
</script>
</body>
</html>
